    <text x="10" y="31" font-size="7.2" font-family="'Bodoni Moda', 'Bodoni 72', Georgia, 'Times New Roman', serif" fill="#1f252b">Wie war es mit uns?</text>
    <text x="10" y="41" font-size="3.2" >Von der Beratung bis zur Lieferung:</text>
    <text x="10" y="45.6" font-size="3.2" >Ihre ehrliche Meinung hilft anderen bei der</text>
    <text x="10" y="50.2" font-size="3.2" >Entscheidung und uns dabei, besser zu werden.</text>
    <text x="10" y="61" font-size="3.6" font-weight="600" fill="#1f252b">platzhirsch.studio/de/bewerten</text>
    <text x="10" y="71" font-size="2.8" fill="#5c636a">Lieber direkt an uns?</text>
    <text x="10" y="75.4" font-size="2.8" fill="#5c636a">info@platzhirsch.studio · +43 5574 46255</text>
    <text x="10" y="88" font-size="3.2" >Herzlich,</text>
    <line x1="25" y1="88.6" x2="80" y2="88.6" stroke="#8a8174" stroke-width="0.2"/>
    <text x="10" y="99" font-size="2.4" fill="#5c636a">Platzhirsch Home Living · Landstraße 11 · 6911 Lochau</text>
    <text x="115.5" y="72" font-size="2.6" text-anchor="middle" fill="#5c636a">Code mit der Handykamera scannen</text>

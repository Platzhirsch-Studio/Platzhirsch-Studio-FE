# deploy/produktion/nginx/backoffice.conf – backoffice.platzhirsch.studio → Next.js 127.0.0.1:3100.
#   certbot --nginx -d backoffice.platzhirsch.studio
# Optional nur VPN/Admin: die allow-Zeilen in backoffice-erlaubt.conf pflegen und "include" einkommentieren.

upstream platzhirsch_backoffice {
    server 127.0.0.1:3100;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name backoffice.platzhirsch.studio;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backoffice.platzhirsch.studio;
    ssl_certificate     /etc/letsencrypt/live/backoffice.platzhirsch.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice.platzhirsch.studio/privkey.pem;
    include /etc/nginx/snippets/platzhirsch-sicherheit.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # include /etc/nginx/snippets/backoffice-erlaubt.conf;   # allow <cidr>; … deny all;
    # Vorschauphase: auth_basic "Platzhirsch Backoffice"; auth_basic_user_file /etc/nginx/backoffice.htpasswd;

    client_max_body_size 50m;
    access_log /var/log/nginx/platzhirsch-backoffice.access.log;
    error_log  /var/log/nginx/platzhirsch-backoffice.error.log warn;

    location / {
        proxy_pass http://platzhirsch_backoffice;
        include /etc/nginx/snippets/platzhirsch-proxy.conf;
    }
}

# deploy/produktion/nginx/backend.conf – backend.platzhirsch.studio → Frappe-Nginx 127.0.0.1:8080.
#   certbot --nginx -d backend.platzhirsch.studio
# Zugriff NUR aus Website-/Backoffice-Netz und Admin-IPs (backend-erlaubt.conf), Ausnahme Stripe-Webhook.

upstream platzhirsch_frappe {
    server 127.0.0.1:8080;
    keepalive 16;
}

map $http_upgrade $platzhirsch_connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name backend.platzhirsch.studio;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backend.platzhirsch.studio;
    ssl_certificate     /etc/letsencrypt/live/backend.platzhirsch.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.platzhirsch.studio/privkey.pem;
    include /etc/nginx/snippets/platzhirsch-sicherheit.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 50m;
    access_log /var/log/nginx/platzhirsch-backend.access.log;
    error_log  /var/log/nginx/platzhirsch-backend.error.log warn;

    # Öffentlich nur der Stripe-Webhook (Signaturprüfung in ph_shop.api.stripe.webhook).
    location = /api/method/ph_shop.api.stripe.webhook {
        limit_except POST { deny all; }
        proxy_pass http://platzhirsch_frappe;
        include /etc/nginx/snippets/platzhirsch-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/backend-erlaubt.conf;
        proxy_pass http://platzhirsch_frappe;
        # Header hier ausgeschrieben (nicht platzhirsch-proxy.conf), weil Connection für socket.io anders ist.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $platzhirsch_connection_upgrade;
        proxy_read_timeout 300s;
    }
}

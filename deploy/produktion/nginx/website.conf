# deploy/produktion/nginx/website.conf – Alternative zu Caddy für den Website-Host.
# /etc/nginx/sites-available/platzhirsch-website → ln -s nach sites-enabled. Zertifikate mit certbot:
#   certbot --nginx -d platzhirsch.studio -d www.platzhirsch.studio
# Ergänzt tools/ci/nginx-platzhirsch.conf.example (dort die Begründungen zu X-Forwarded-For und /cmx).

# Snippets (gleicher Ordner): platzhirsch-sicherheit.conf, platzhirsch-proxy.conf → /etc/nginx/snippets/

map $upstream_status $platzhirsch_cmx_cache {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

upstream platzhirsch_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name platzhirsch.studio www.platzhirsch.studio;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://platzhirsch.studio$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.platzhirsch.studio;
    ssl_certificate     /etc/letsencrypt/live/platzhirsch.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platzhirsch.studio/privkey.pem;
    return 301 https://platzhirsch.studio$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name platzhirsch.studio;
    ssl_certificate     /etc/letsencrypt/live/platzhirsch.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platzhirsch.studio/privkey.pem;
    include /etc/nginx/snippets/platzhirsch-sicherheit.conf;

    client_max_body_size 25m;
    access_log /var/log/nginx/platzhirsch-website.access.log;
    error_log  /var/log/nginx/platzhirsch-website.error.log warn;

    location /cmx/ {
        proxy_pass http://platzhirsch_next;
        include /etc/nginx/snippets/platzhirsch-proxy.conf;
        proxy_hide_header Cache-Control;
        # add_header in einer location verwirft die des server-Blocks → Sicherheits-Header erneut.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $platzhirsch_cmx_cache always;
    }

    location / {
        proxy_pass http://platzhirsch_next;
        include /etc/nginx/snippets/platzhirsch-proxy.conf;
    }
}

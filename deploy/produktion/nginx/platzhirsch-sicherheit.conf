# /etc/nginx/snippets/platzhirsch-sicherheit.conf – gemeinsame Sicherheits-Header (alle drei Hosts).
# Werte identisch zu next.config.js der Website, damit doppelte Header sich nicht widersprechen.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
server_tokens off;
proxy_hide_header X-Powered-By;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:platzhirsch_ssl:10m;
ssl_session_timeout 1d;

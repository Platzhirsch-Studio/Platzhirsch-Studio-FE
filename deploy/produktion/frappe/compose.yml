# deploy/produktion/frappe/compose.yml – Frappe-Backend (backend.platzhirsch.studio), eigener Host.
# Gleicher Aufbau wie deploy/staging, aber: Image ohne Testwerkzeuge (PH_DEV_TOOLS=0), kein
# Developer Mode, keine allow_tests, Nginx nur auf 127.0.0.1:8080 (davor Caddy/Nginx mit TLS und
# IP-Freigabe, siehe ../caddy/Caddyfile bzw. ../nginx/backend.conf).
# Einrichten: ./einrichten.sh   Backup: ./backup.sh (Cron, siehe backup.cron)

name: ${COMPOSE_PROJECT_NAME:-ph-frappe}

x-frappe: &frappe
  image: ${FRAPPE_IMAGE:-platzhirsch/frappe-ph:produktion}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    - ../../staging/scripts:/opt/ph-deploy:ro
  networks: [frappe]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  backend:
    <<: *frappe
    build:
      context: ../../..
      dockerfile: deploy/staging/Containerfile.frappe
      args:
        FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-15}
        PH_DEV_TOOLS: "0"
        PH_WALLET: ${PH_WALLET:-1}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    <<: *frappe
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        printf '%s\n' frappe $$PH_APPS > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        bench set-config -gp developer_mode 0;
        echo "configurator fertig";
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  frontend:
    <<: *frappe
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?SITE_NAME fehlt}
      # Davor sitzt Caddy/Nginx auf demselben Host: dessen X-Forwarded-For übernehmen.
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-172.16.0.0/12}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:${FRAPPE_HTTP_PORT:-8080}:8080"
    depends_on: [backend, websocket]

  websocket:
    <<: *frappe
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *frappe
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *frappe
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *frappe
    command: ["bench", "schedule"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-1G}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql
    networks: [frappe]

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks: [frappe]

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    networks: [frappe]

networks:
  frappe: {}

volumes:
  sites: {}
  logs: {}
  db-data: {}
  redis-queue-data: {}

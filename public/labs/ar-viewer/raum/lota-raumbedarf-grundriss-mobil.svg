<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -14 440 330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#2b2f33">
  <!-- Mobilfassung der Raumbedarf-Zeichnung (R5, Fix-Team P4): weniger Beschriftung, große Schrift.
       ClassiCon Lota Sofa 240 × 95 cm (Herstellermaße, Grundfläche), davor 45 cm bis zum Tisch, 90 cm Laufweg. -->
  <rect x="0" y="-8" width="420" height="8" fill="#2b2f33"/>
  <rect x="90" y="10" width="240" height="95" fill="#ece6dc" stroke="#2b2f33" stroke-width="4"/>
  <text x="210" y="69" text-anchor="middle" font-weight="600">240 × 95</text>
  <rect x="150" y="150" width="120" height="60" fill="#ffffff" stroke="#2b2f33" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="0" y="210" width="420" height="90" fill="#3c6e7a" opacity="0.14"/>
  <text x="210" y="266" text-anchor="middle">Laufweg 90</text>
</svg>
